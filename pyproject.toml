[build-system]
requires = ["flit"]
build-backend = "flit.buildapi"

[project]
name = "appeal"
authors = [
    {name = "Larry Hastings", email = "larry@hastings.org"},
    ]
readme = "README.md"
requires-python = ">=3.6"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    ]
dynamic = [
    'version',
    'description',
    ]
dependencies = [
    # help, usage, and error output render through big's markdown +
    # stylesheet pipeline; 0.15 adds the StyledText node the help tables
    # rely on.  (Argument parsing itself never imports big -- only
    # presentation does, lazily, so the success path stays fast.)
    "big >= 0.15",
]

[project.urls]
Source = "https://github.com/larryhastings/appeal/"

[project.optional-dependencies]
# the name CI installs: pip install '.[test]'
test = ['perky', 'tomli']

[tool.coverage.run]
source = ["appeal"]

