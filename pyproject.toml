[build-system]
requires = ["flit"]
build-backend = "flit.buildapi"

[project]
name = "appeal"
authors = [
    {name = "Larry Hastings", email = "larry@hastings.org"},
    ]
readme = "README.md"
requires-python = ">=3.6"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    ]
dynamic = [
    'version',
    'description',
    ]
dependencies = [
    # only consulted at emission time (big.snip carves the
    # runtime snippets); parsing in-process never imports it,
    # and emitted scripts need neither big nor appeal
    "big >= 0.14",
]

[project.urls]
Source = "https://github.com/larryhastings/appeal/"

[project.optional-dependencies]
# the name CI installs: pip install '.[test]'
test = ['perky', 'tomli']

[tool.coverage.run]
source = ["appeal"]
omit = [
    # v1 keepsake, not part of v2: argument_grouping is the
    # grouping reference implementation (kept on purpose)
    "appeal/argument_grouping.py",
]

