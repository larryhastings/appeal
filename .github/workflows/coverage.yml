name: Run coverage

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  run-coverage:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - name: Install necessary dependencies
      run: |
        python -m pip install --upgrade pip coverage
        pip install .
    - name: Run coverage without optional dependencies
      run: |
        coverage run --branch --parallel-mode tests/test_all.py
    - name: Install optional dependencies
      run: |
        python -m pip install . '.[test]'
    - name: Run coverage with optional dependencies
      run: |
        coverage run --branch --parallel-mode tests/test_all.py
    - name: Produce coverage reports
      run: |
        coverage combine
        coverage html -i
        echo '```' >> $GITHUB_STEP_SUMMARY
        coverage report -i >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
    - name: Upload htmlcov
      uses: actions/upload-artifact@v4
      with:
        name: appeal_htmlcov
        path: htmlcov/
    # the line in the sand: today's true branch-mode score, so we can't
    # backslide.  Raise to 100 when the 36-partial-branch audit lands.
    - name: Fail if branch coverage regresses below 99%
      run: |
        coverage report -i --fail-under=99
